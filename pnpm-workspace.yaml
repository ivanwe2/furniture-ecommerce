# Approvals for packages allowed to run install/build scripts (native binary /
# bundler). pnpm 11 records these here (written by `pnpm approve-builds`); the
# package.json "pnpm" field is no longer read.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Force ONE sharp across the tree. Our direct dependency is patched, but
# next@16 pulls its own sharp for the image optimizer, and <0.35.0 inherits the
# libvips CVEs (GHSA-f88m-g3jw-g9cj). Without this the vulnerable copy stays
# installed and reachable. Drop the override once next ships >=0.35 itself.
overrides:
  sharp: 0.35.3
