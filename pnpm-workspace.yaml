# Approvals for packages allowed to run install/build scripts (native binary /
# bundler). pnpm 11 records these here (written by `pnpm approve-builds`); the
# package.json "pnpm" field is no longer read.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Force ONE sharp across the tree. Our direct dependency is patched, but
# next@16 pulls its own sharp for the image optimizer, and <0.35.0 inherits the
# libvips CVEs (GHSA-f88m-g3jw-g9cj). Without this the vulnerable copy stays
# installed and reachable. Drop the override once next ships >=0.35 itself.
overrides:
  sharp: 0.35.5
  # Security floor for transitive packages (audit 2026-11-14, docs/SECURITY.md
  # audit record). Same major as the parents ask for, so nothing changes API;
  # each line only lifts a vulnerable patch level. Remove a line once the
  # parent ships the fixed version itself (`pnpm why <pkg>`).
  dompurify@3: ^3.4.17
  fast-uri@3: ^3.1.9
  undici@7: ^7.30.2
  js-yaml@4: ^4.3.2
  nanoid@3: ^3.3.20
  browserslist@4: ^4.29.5
  source-map-js@1: ^1.2.2
  postcss@8: 8.5.32
  happy-dom@20: ^20.14.6
  baseline-browser-mapping@2: ^2.11.37
  fast-copy@3: ^3.1.0
  brace-expansion@1: ^1.1.22
  brace-expansion@5: ^5.0.13
  # vitest asks for `^6 || ^7 || ^8`, which a `vite@7` selector does not match.
  vite: 7.3.8
  fflate@0.6: ^0.6.11

# Advisories with no fixed version in the major we can use, each judged not
# reachable in production (docs/SECURITY.md → Accepted risks, audit 2026-11-14).
# Re-check every audit; remove an entry as soon as a fix ships.
auditConfig:
  ignoreGhsas:
    # zod 3: memory exhaustion on oversized constrained collections; fixed only
    # in zod 4 (major). Our zod schemas sit behind server actions whose body
    # Next caps at 1 MB.
    - GHSA-mrhx-c7xc-m3w5
    # happy-dom (via @lexical/headless and vitest): only reached when parsing
    # HTML server-side, which this app never does; fixed only in happy-dom 21.
    - GHSA-834v-8h66-3h79
    - GHSA-c8p4-j97h-3vg8
    # esbuild 0.18 inside drizzle-kit's loader: a dev-server CORS issue; the app
    # never runs esbuild's dev server.
    - GHSA-67mh-4wv8-2f99
    # deepmerge: no fixed 4.x release published; Payload merges its own config
    # objects with it, never request input.
    - GHSA-gcqx-w48m-w2h4
