# Настех — self-hosted multi-service stack.
#
# The client's sysadmin runs a reverse proxy (nginx/Caddy/Traefik) that
# terminates TLS for nasteh.bg and proxies to the app on port 3000. TLS, DNS,
# and mail-DNS (SPF/DKIM/DMARC) are the sysadmin's responsibility.
#
#   1. cp .env.example .env   # then fill it in (see DEPLOY.md)
#   2. docker compose up -d --build
#
# Services: app (Next + Payload) · db (PostgreSQL) · redis (rate-limit store).
# Mail lands in the next phase. Persistent state = named volumes: `pgdata`
# (Postgres) and `media` (uploads). Back both up (see DEPLOY.md).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nasteh-bg:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Cap container log growth (structured JSON logs + Next/Payload output).
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    env_file: .env
    ports:
      # Publish on loopback only — the app is reachable ONLY through the
      # sysadmin's reverse proxy (which terminates TLS), never directly from
      # the network. If the proxy runs on a DIFFERENT host, change to
      # "3000:3000" and firewall the port (or put both on a Docker network).
      - '127.0.0.1:3000:3000'
    volumes:
      - media:/app/media # uploaded images + sized variants
    healthcheck:
      # robots.txt is static (no DB) — a cheap liveness probe
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      # Headroom for a slower/CPU-limited host's first boot (migrate + Next).
      start_period: 90s

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Rate-limit counters only — ephemeral, so no persistence (AOF/RDB off).
    # Cap memory and evict the oldest keys rather than growing unbounded.
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory', '64mb', '--maxmemory-policy', 'allkeys-lru']
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  media:
