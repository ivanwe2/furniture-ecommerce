# Tempo 2.10 (patched line), single binary, local storage. Traces kept 7 days.
# (Tempo 3.x changed its config model; 2.10 is pinned until that is evaluated.)
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 168h

usage_report:
  reporting_enabled: false
