# Email alerts (DEPLOY §11). Sent to ALERT_EMAIL through the stack's own
# Postfix relay. Provisioned on every start; edit here, not in the UI.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: alert-email
    receivers:
      - uid: nasteh-alert-email
        type: email
        settings:
          addresses: ${ALERT_EMAIL}
          singleEmail: true

policies:
  - orgId: 1
    receiver: alert-email
    group_by: ['grafana_folder', 'alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: nasteh
    folder: Nasteh
    interval: 1m
    rules:
      - uid: nasteh-site-down
        title: Site is down (health check failing)
        condition: B
        for: 3m
        noDataState: Alerting
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: /api/health has not answered 200 for 3 minutes (database down, or the app is not running).
          runbook: 'docker compose ps; docker compose logs --tail 100 app db'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: 'min(probe_success)', instant: true }
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      - uid: nasteh-order-failures
        title: Order, contact or email failure
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: The app logged an error while placing an order or sending an order/contact email. Orders are saved before emails, so check the admin for orders whose emails did not go out.
          runbook: 'Grafana → System health → Recent errors (area order / contact / email)'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model: { refId: A, expr: 'sum(count_over_time({service="app", level="error", area=~"order|contact|email"}[10m]))', queryType: instant }
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]

      - uid: nasteh-error-spike
        title: Spike in server errors
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: More than 20 error log lines from the app in 10 minutes.
          runbook: 'Grafana → System health → Recent errors; a log line traceId opens its trace'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model: { refId: A, expr: 'sum(count_over_time({service="app", level="error"}[10m]))', queryType: instant }
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [20] } }]

      - uid: nasteh-5xx
        title: Many failed page responses (5xx)
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: More than 5 % of page responses over 10 minutes were server errors.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                (sum(rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER", http_status_code=~"5.."}[10m])) or vector(0))
                / clamp_min(sum(rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER"}[10m])), 0.001)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0.05] } }]

      - uid: nasteh-disk
        title: Disk almost full
        condition: B
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: Less than 15 % free on the disk Docker stores the shop on (database, photos, backups, logs).
          runbook: 'docker system df; prune old images: docker image prune -f'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            # Alloy's data volume lives on the partition that holds every Docker volume.
            model: { refId: A, expr: 'min(node_filesystem_avail_bytes{mountpoint="/var/lib/alloy/data"} / node_filesystem_size_bytes{mountpoint="/var/lib/alloy/data"})', instant: true }
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: lt, params: [0.15] } }]

      - uid: nasteh-postgres-down
        title: Database not reachable
        condition: B
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: The Postgres exporter cannot reach the database.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: 'min(pg_up)', instant: true }
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: lt, params: [1] } }]
