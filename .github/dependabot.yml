# Weekly dependency PRs (security audit 2026-11-14). Majors are ignored on
# purpose: CLAUDE.md rule 2 needs a Decisions-log entry and Ivan's OK before any
# major move. Security advisories still arrive through GitHub's Dependabot
# alerts (repo Settings → Code security), which are independent of this file.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      payload:
        patterns: ['payload', '@payloadcms/*']
      next:
        patterns: ['next', 'eslint-config-next']
      patches:
        update-types: ['patch']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
