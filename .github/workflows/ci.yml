name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Fails on any high/critical advisory in production dependencies that is
      # not listed (with its reason) under auditConfig.ignoreGhsas in
      # pnpm-workspace.yaml. Security audit 2026-11-14: the repo had drifted to
      # 9 critical / 54 high because nothing checked this.
      - name: Dependency audit (prod, high+)
        run: pnpm audit --prod --audit-level high

      - name: Guardrail — no hex colors in components
        run: |
          ! grep -rEn '#[0-9a-fA-F]{3,8}\b' src/app src/components --include='*.tsx' --include='*.ts' || (echo 'Hex color outside tokens' && exit 1)

      - name: Guardrail — no /cdn-cgi/image/ outside images.ts
        run: |
          ! grep -rn '/cdn-cgi/image/' src --exclude=images.ts || (echo '/cdn-cgi/image/ outside images.ts' && exit 1)

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # CLAUDE rule 11 requires a green build. Every page is rendered on
      # demand, so the build never connects to the database — the values below
      # only satisfy config loading and are not secrets.
      - name: Build
        run: pnpm build
        env:
          PAYLOAD_SECRET: ci-build-only-not-a-secret
          DATABASE_URI: postgres://ci:ci@127.0.0.1:5432/ci
          NEXT_PUBLIC_SITE_URL: https://nasteh.bg

      - name: Env key-drift check
        run: |
          EXPECTED=$(grep -oP '^[A-Z_]+(?==)' .env.example | sort)
          ACTUAL=$(cat .github/workflows/env-keys.txt | sort)
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERROR: .env.example keys have drifted from committed list."
            echo "Expected (from .env.example):"
            echo "$EXPECTED"
            echo "Committed (from env-keys.txt):"
            echo "$ACTUAL"
            diff <(echo "$EXPECTED") <(echo "$ACTUAL") || true
            exit 1
          fi
